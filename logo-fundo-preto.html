<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue Summit — Logo com Fundo Preto</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18046482128"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    gtag('config', 'AW-18046482128');

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', 'Inter', system-ui, sans-serif;
      background: #000;
      display: flex;
      flex-direction: column;
      gap: 60px;
      padding: 60px;
      min-height: 100vh;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 40px;
      background: #000;
      border-radius: 12px;
    }

    .logo__icon {
      width: 60px;
      height: 45px;
    }

    .logo__text {
      display: flex;
      flex-direction: column;
    }

    .logo__name {
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
      line-height: 1.15;
    }

    .logo__blue {
      color: #2EB5F5;
    }

    .logo__tagline {
      font-size: 0.65rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .logo-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .logo-section h2 {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 40px;
      width: 100%;
    }

    /* Apenas ícone */
    .icon-only {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 150px;
      height: 150px;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
    }

    .icon-only svg {
      width: 100px;
      height: 75px;
    }

    /* Logo completa horizontal */
    .logo-horizontal {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 30px;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      width: 100%;
    }

    .logo-horizontal svg {
      width: 60px;
      height: 45px;
      flex-shrink: 0;
    }

    /* Logo completa vertical */
    .logo-vertical {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 40px;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      min-height: 280px;
    }

    .logo-vertical svg {
      width: 80px;
      height: 60px;
    }

    .logo-vertical .logo__text {
      text-align: center;
    }

    .logo-vertical .logo__name {
      font-size: 2rem;
    }

    /* Download section */
    .section-title {
      color: #fff;
      font-size: 1.2rem;
      font-weight: 700;
      margin-top: 40px;
      margin-bottom: 20px;
    }

    .button-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 24px;
      background: #2EB5F5;
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    button:hover {
      background: #1a7de8;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="section-title">LOGO - FUNDO PRETO</div>

  <!-- Grid de variações -->
  <div class="grid">

    <!-- Apenas ícone -->
    <div class="logo-section">
      <div class="icon-only">
        <svg viewBox="0 0 50 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 36L16 8L32 36H0Z" fill="#4A9FD7"/>
          <path d="M16 36L34 2L50 36H16Z" fill="#2EB5F5"/>
          <path d="M12 16L16 8L20 16L18.2 14.5L16 17.5L13.8 14.5Z" fill="#fff"/>
          <path d="M30 10L34 2L38 10L36.2 8.5L34 11.5L31.8 8.5Z" fill="#fff"/>
        </svg>
      </div>
      <h2>Apenas ícone</h2>
    </div>

    <!-- Logo vertical -->
    <div class="logo-section">
      <div class="logo-vertical">
        <svg viewBox="0 0 50 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 36L16 8L32 36H0Z" fill="#4A9FD7"/>
          <path d="M16 36L34 2L50 36H16Z" fill="#2EB5F5"/>
          <path d="M12 16L16 8L20 16L18.2 14.5L16 17.5L13.8 14.5Z" fill="#fff"/>
          <path d="M30 10L34 2L38 10L36.2 8.5L34 11.5L31.8 8.5Z" fill="#fff"/>
        </svg>
        <div class="logo__text">
          <span class="logo__name"><span class="logo__blue">Blue</span>Summit</span>
          <span class="logo__tagline">SERVIÇOS FINANCEIROS</span>
        </div>
      </div>
      <h2>Logo vertical</h2>
    </div>

  </div>

  <!-- Logo horizontal -->
  <div>
    <div class="section-title">LOGO HORIZONTAL</div>
    <div class="logo-horizontal">
      <svg viewBox="0 0 50 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 36L16 8L32 36H0Z" fill="#4A9FD7"/>
        <path d="M16 36L34 2L50 36H16Z" fill="#2EB5F5"/>
        <path d="M12 16L16 8L20 16L18.2 14.5L16 17.5L13.8 14.5Z" fill="#fff"/>
        <path d="M30 10L34 2L38 10L36.2 8.5L34 11.5L31.8 8.5Z" fill="#fff"/>
      </svg>
      <div class="logo__text">
        <span class="logo__name"><span class="logo__blue">Blue</span>Summit</span>
        <span class="logo__tagline">SERVIÇOS FINANCEIROS</span>
      </div>
    </div>
  </div>

  <!-- Opções com diferentes tamanhos -->
  <div>
    <div class="section-title" style="margin-bottom: 40px;">VARIAÇÕES DE TAMANHO</div>
    <div style="display: flex; gap: 40px; align-items: center; flex-wrap: wrap;">
      <!-- Grande -->
      <div style="padding: 30px; background: #000; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;">
        <div style="display: flex; align-items: center; gap: 24px;">
          <svg viewBox="0 0 50 36" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 100px; height: 75px;">
            <path d="M0 36L16 8L32 36H0Z" fill="#4A9FD7"/>
            <path d="M16 36L34 2L50 36H16Z" fill="#2EB5F5"/>
            <path d="M12 16L16 8L20 16L18.2 14.5L16 17.5L13.8 14.5Z" fill="#fff"/>
            <path d="M30 10L34 2L38 10L36.2 8.5L34 11.5L31.8 8.5Z" fill="#fff"/>
          </svg>
          <div class="logo__text">
            <span class="logo__name"><span class="logo__blue">Blue</span>Summit</span>
            <span class="logo__tagline">SERVIÇOS FINANCEIROS</span>
          </div>
        </div>
        <p style="color: rgba(255, 255, 255, 0.5); font-size: 0.8rem; margin-top: 16px;">Grande</p>
      </div>

      <!-- Médio -->
      <div style="padding: 20px; background: #000; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;">
        <div style="display: flex; align-items: center; gap: 16px;">
          <svg viewBox="0 0 50 36" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 60px; height: 45px;">
            <path d="M0 36L16 8L32 36H0Z" fill="#4A9FD7"/>
            <path d="M16 36L34 2L50 36H16Z" fill="#2EB5F5"/>
            <path d="M12 16L16 8L20 16L18.2 14.5L16 17.5L13.8 14.5Z" fill="#fff"/>
            <path d="M30 10L34 2L38 10L36.2 8.5L34 11.5L31.8 8.5Z" fill="#fff"/>
          </svg>
          <div class="logo__text">
            <span class="logo__name" style="font-size: 1.3rem;"><span class="logo__blue">Blue</span>Summit</span>
            <span class="logo__tagline" style="font-size: 0.52rem;">SERVIÇOS FINANCEIROS</span>
          </div>
        </div>
        <p style="color: rgba(255, 255, 255, 0.5); font-size: 0.8rem; margin-top: 12px;">Médio</p>
      </div>

      <!-- Pequeno -->
      <div style="padding: 12px; background: #000; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <svg viewBox="0 0 50 36" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 36px; height: 27px;">
            <path d="M0 36L16 8L32 36H0Z" fill="#4A9FD7"/>
            <path d="M16 36L34 2L50 36H16Z" fill="#2EB5F5"/>
            <path d="M12 16L16 8L20 16L18.2 14.5L16 17.5L13.8 14.5Z" fill="#fff"/>
            <path d="M30 10L34 2L38 10L36.2 8.5L34 11.5L31.8 8.5Z" fill="#fff"/>
          </svg>
          <div class="logo__text">
            <span class="logo__name" style="font-size: 0.95rem;"><span class="logo__blue">Blue</span>Summit</span>
            <span class="logo__tagline" style="font-size: 0.4rem;">SERVIÇOS FINANCEIROS</span>
          </div>
        </div>
        <p style="color: rgba(255, 255, 255, 0.5); font-size: 0.65rem; margin-top: 8px;">Pequeno</p>
      </div>
    </div>
  </div>

</body>
</html>
